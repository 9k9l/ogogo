name: Build APK

# Manual only: run it from the Actions tab (or from your app). No required inputs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional label (ignored by the build)'
        required: false
        default: ''

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (signed automatically with the debug key, installable)
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
